  <!-- Theme Initialization Script to prevent flash of unstyled content -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('pomodoro_theme');
        const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
