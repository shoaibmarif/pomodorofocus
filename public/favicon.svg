<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5757" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer subtle circular ring -->
  <circle cx="64" cy="64" r="60" fill="#0F172A" />
  <circle cx="64" cy="64" r="58" fill="none" stroke="#334155" stroke-width="2" opacity="0.4" />
  
  <!-- Tomato main body -->
  <circle cx="64" cy="70" r="42" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Timer dial marks -->
  <circle cx="64" cy="70" r="32" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.75" />
  <circle cx="64" cy="70" r="5" fill="#FFFFFF" />
  <line x1="64" y1="70" x2="64" y2="48" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="70" x2="78" y2="70" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Leaf and Stem -->
  <path d="M64 26 C64 20, 68 16, 74 15 C72 20, 68 25, 64 28 Z" fill="#D97706" />
  <path d="M64 28 C56 22, 46 25, 48 34 C55 35, 61 32, 64 28 Z" fill="url(#leafGrad)" />
  <path d="M64 28 C72 22, 82 25, 80 34 C73 35, 67 32, 64 28 Z" fill="url(#leafGrad)" />
</svg>
